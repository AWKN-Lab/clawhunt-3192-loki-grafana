# 租户级留存覆盖（由 loki/runtime.yaml 加载；Loki 3.x 的 override 是扁平字段）
# 本文件由 scripts/gen_runtime_config.sh 生成 —— 变量真源见 .env.example：
#   LOG_RETENTION_DAYS=7 / TEST_RETENTION_DAYS=30
#   PROD_RETENTION_DAYS=180 / AUDIT_RETENTION_DAYS=365
overrides:
  dev:
    retention_period: 7h
  test:
    retention_period: 30h
  prod:
    retention_period: 180h
  audit:
    retention_period: 365h
